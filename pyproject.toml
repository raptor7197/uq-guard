[project]
name = "uqguard"
version = "0.0.1"
description = "Uncertainty-gated tool calls for LangGraph agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0",
    "langgraph>=1.0",
    "numpy>=1.26",
    "pydantic>=2",
]

[project.optional-dependencies]
# LogisticFusion.fit and eval/calibrate.py need these; core gating does not.
# eval/run_when2call.py additionally needs `datasets` to load the benchmark.
# Keep floors in sync with the dev group below (single source of truth).
eval = ["scikit-learn>=1.4", "matplotlib>=3.8", "datasets>=3"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "langchain-openai",
    "langchain-ollama",
    "langchain-google-genai>=4.2.7",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "datasets>=3",
    "streamlit>=1.59.1",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.165.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["uqguard"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["examples"]  # tests import the demo agent fixture without sys.path hacks
